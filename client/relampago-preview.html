<!doctype html>
<!--
  ⚡ Bancada do Relâmpago. FORA de `public/`, como a `fx-preview.html` e a
  `esfera-preview.html`: serve no `npm run dev` e não entra no pacote.

  Toca a folha no MESMO ritmo do jogo (840 ms, 25 quadros) e marca em que
  instante cada dano do Lv.10 cai — é o que o dono pediu conferir: *"os danos
  vão aparecendo enquanto ele cai e um pouquinho antes dele sumir"*.
-->
<meta charset="utf-8">
<title>Relâmpago — bancada</title>
<style>
  body { margin: 0; background: #3f5a34; color: #dfe; font: 13px system-ui, sans-serif; }
  canvas { display: block; image-rendering: pixelated; }
  p { padding: 6px 10px; margin: 0; opacity: .85; }
</style>
<canvas id="c" width="960" height="320"></canvas>
<p id="leg"></p>
<script type="module">
  const c = document.getElementById('c');
  const g = c.getContext('2d');
  const img = await new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.src = '/assets/fx/relampago25.png'; });
  const N = 25, LW = img.width / N, LH = img.height;
  const DUR = 840, ESCALA = 0.625 * 0.80, TS = 32;
  const DANOS = [260, 400, 540, 680];   // Lv.10: quedaMs + i × 140
  const CICLO = 1400;

  function quadro(t) {
    g.fillStyle = '#3f5a34'; g.fillRect(0, 0, c.width, c.height);
    const ciclo = t % CICLO;
    // chão de referência e um "monstro" do tamanho de um tile
    g.fillStyle = '#00000030'; g.fillRect(0, 250, c.width, 2);
    g.fillStyle = '#00000040'; g.fillRect(460 - 16, 250 - 40, 32, 40);
    if (ciclo < DUR) {
      const k = Math.min(N - 1, Math.floor((ciclo / DUR) * N));
      const w = LW * ESCALA * 2, h = LH * ESCALA * 2;  // ×2: bancada 1:1, o jogo tem zoom
      g.globalCompositeOperation = 'lighter';
      g.drawImage(img, k * LW, 0, LW, LH, 460 - w / 2, 252 - h, w, h);
      g.globalCompositeOperation = 'source-over';
      // os números aparecendo, como no jogo
      g.fillStyle = '#ffe36a'; g.font = 'bold 20px system-ui';
      DANOS.forEach((ms, i) => {
        if (ciclo < ms || ciclo > ms + 700) return;
        g.globalAlpha = Math.max(0, 1 - (ciclo - ms) / 700);
        g.fillText('412', 500 + i * 34, 210 - (ciclo - ms) * 0.03);
      });
      g.globalAlpha = 1;
    }
    document.getElementById('leg').textContent =
      `${Math.round(ciclo)} ms / ${DUR} ms · quadro ${ciclo < DUR ? Math.floor((ciclo / DUR) * N) + 1 : '—'} de ${N}`
      + ` · danos em ${DANOS.join(', ')} ms · tile = ${TS * 2} px na bancada`;
  }

  if (location.hash === '#tiras') {
    const COL = 5, CEL = 190, N2 = 15;
    const alvo = document.createElement('canvas');
    alvo.width = CEL * COL; alvo.height = 220 * Math.ceil(N2 / COL);
    const ag = alvo.getContext('2d');
    for (let i = 0; i < N2; i++) {
      quadro((i / N2) * DUR);
      ag.drawImage(c, 365, 40, 190, 220, (i % COL) * CEL, Math.floor(i / COL) * 220, CEL, 220);
    }
    c.replaceWith(alvo);
  } else {
    const t0 = performance.now();
    const laco = () => { quadro(performance.now() - t0); requestAnimationFrame(laco); };
    laco();
  }
</script>
