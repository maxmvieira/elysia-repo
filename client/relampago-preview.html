<!doctype html>
<!--
  ⚡ Bancada do Relâmpago. FORA de `public/`, como a `fx-preview.html` e a
  `esfera-preview.html`: serve no `npm run dev` e não entra no pacote.

  Toca a folha no MESMO ritmo do jogo (840 ms, 25 quadros) e marca em que
  instante cada dano do Lv.10 cai — é o que o dono pediu conferir: *"os danos
  vão aparecendo enquanto ele cai e um pouquinho antes dele sumir"*.
-->
<meta charset="utf-8">
<title>Relâmpago — bancada</title>
<style>
  body { margin: 0; background: #3f5a34; color: #dfe; font: 13px system-ui, sans-serif; }
  canvas { display: block; image-rendering: pixelated; }
  p { padding: 6px 10px; margin: 0; opacity: .85; }
</style>
<canvas id="c" width="960" height="640"></canvas>
<p id="leg"></p>
<script type="module">
  const c = document.getElementById('c');
  const g = c.getContext('2d');
  const img = await new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.src = '/assets/fx/relampago24.png'; });
  const N = 24, LW = img.width / N, LH = img.height;
  const DUR = 1200, ESCALA = 0.625 * 1.80, TS = 32;
  /*
   * Lv.10 da ficha: UM relâmpago, 4 descargas numa janela de 460 ms, a primeira
   * aos 400 ms (é quando o raio toca o chão). Ver `quedaUnica`.
   */
  const DESCARGAS = 4, JANELA = 460, PASSO = JANELA / DESCARGAS, QUEDA = 400;
  const CICLO = DUR + 700;
  const CX = 460, CHAO = 580;

  function quadro(t) {
    g.fillStyle = '#3f5a34'; g.fillRect(0, 0, c.width, c.height);
    const ciclo = t % CICLO;
    // A ÁREA de dano (7×7 tiles no Lv.10) e dois "monstros" dentro dela.
    const T = TS * 2;                       // ×2: bancada 1:1, o jogo tem zoom
    g.strokeStyle = '#ffffff28'; g.lineWidth = 2;
    g.strokeRect(CX - 3.5 * T, CHAO - 1.6 * T, 7 * T, 3.2 * T);
    g.fillStyle = '#00000040';
    g.fillRect(CX - 16, CHAO - 40, 32, 40);
    g.fillRect(CX - 2 * T - 16, CHAO - 40, 32, 40);

    // UM relâmpago só, no centro da área. Ver `quedaUnica` na ficha.
    const w = LW * ESCALA * 2, h = LH * ESCALA * 2;
    if (ciclo < DUR) {
      g.globalCompositeOperation = 'lighter';
      const k = Math.min(N - 1, Math.floor((ciclo / DUR) * N));
      g.drawImage(img, k * LW, 0, LW, LH, CX - w / 2, CHAO - h, w, h);
      g.globalCompositeOperation = 'source-over';
    }

    // Os números: cada descarga castiga TODA a área.
    g.fillStyle = '#ffe36a'; g.font = 'bold 20px system-ui';
    for (let i = 0; i < DESCARGAS; i++) {
      const ms = QUEDA + i * PASSO;
      if (ciclo < ms || ciclo > ms + 700) continue;
      g.globalAlpha = Math.max(0, 1 - (ciclo - ms) / 700);
      g.fillText('412', CX + 150 + i * 34, CHAO - 70 - (ciclo - ms) * 0.03);
    }
    g.globalAlpha = 1;

    const quadroAtual = ciclo < DUR ? Math.floor((ciclo / DUR) * N) + 1 : '—';
    document.getElementById('leg').textContent =
      `${Math.round(ciclo)} ms · quadro ${quadroAtual} de ${N} · folha ${DUR} ms`
      + ` · ${DESCARGAS} descargas a partir de ${QUEDA} ms, ${Math.round(PASSO)} ms entre elas`
      + ` · raio ${Math.round(w / 2)}×${Math.round(h / 2)} px no jogo`
      + ` (${(w / 2 / TS).toFixed(1)}×${(h / 2 / TS).toFixed(1)} tiles) · tile = ${T} px aqui`;
  }

  if (location.hash === '#tiras') {
    const COL = 5, CEL = 190, N2 = 15;
    const alvo = document.createElement('canvas');
    alvo.width = CEL * COL; alvo.height = 300 * Math.ceil(N2 / COL);
    const ag = alvo.getContext('2d');
    for (let i = 0; i < N2; i++) {
      quadro((i / N2) * DUR);
      ag.drawImage(c, 240, 20, 440, 600, (i % COL) * CEL, Math.floor(i / COL) * 300, CEL, 300);
    }
    c.replaceWith(alvo);
  } else {
    const t0 = performance.now();
    const laco = () => { quadro(performance.now() - t0); requestAnimationFrame(laco); };
    laco();
  }
</script>
