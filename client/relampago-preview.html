<!doctype html>
<!--
  ⚡ Bancada do Relâmpago. FORA de `public/`, como a `fx-preview.html` e a
  `esfera-preview.html`: serve no `npm run dev` e não entra no pacote.

  Toca a folha no MESMO ritmo do jogo (840 ms, 25 quadros) e marca em que
  instante cada dano do Lv.10 cai — é o que o dono pediu conferir: *"os danos
  vão aparecendo enquanto ele cai e um pouquinho antes dele sumir"*.
-->
<meta charset="utf-8">
<title>Relâmpago — bancada</title>
<style>
  body { margin: 0; background: #3f5a34; color: #dfe; font: 13px system-ui, sans-serif; }
  canvas { display: block; image-rendering: pixelated; }
  p { padding: 6px 10px; margin: 0; opacity: .85; }
</style>
<canvas id="c" width="960" height="560"></canvas>
<p id="leg"></p>
<script type="module">
  const c = document.getElementById('c');
  const g = c.getContext('2d');
  const img = await new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.src = '/assets/fx/relampago31.png'; });
  const N = 31, LW = img.width / N, LH = img.height;
  const DUR = 900, ESCALA = 0.625 * 1.30, TS = 32;
  // Lv.10 da ficha: 6 raios numa janela de 2100 ms, o dano de cada um aos 500 ms.
  const RAIOS = 6, JANELA = 2100, PASSO = JANELA / RAIOS, QUEDA = 500;
  const CICLO = JANELA + DUR + 600;
  /*
   * Pontos sorteados dentro do bloco 7×7 do Lv.10, em tiles a partir do centro.
   * Fixos na bancada de propósito: com sorteio de verdade, duas execuções não
   * dariam para comparar.
   */
  const PONTOS = [[0, 0], [-2, 1], [2, -1], [-1, -2], [1, 2], [3, 0]];
  const CX = 460, CHAO = 500;

  function quadro(t) {
    g.fillStyle = '#3f5a34'; g.fillRect(0, 0, c.width, c.height);
    const ciclo = t % CICLO;
    // A ÁREA de dano (7×7 tiles no Lv.10) e dois "monstros" dentro dela.
    const T = TS * 2;                       // ×2: bancada 1:1, o jogo tem zoom
    g.strokeStyle = '#ffffff28'; g.lineWidth = 2;
    g.strokeRect(CX - 3.5 * T, CHAO - 1.6 * T, 7 * T, 3.2 * T);
    g.fillStyle = '#00000040';
    g.fillRect(CX - 16, CHAO - 40, 32, 40);
    g.fillRect(CX - 2 * T - 16, CHAO - 40, 32, 40);

    g.globalCompositeOperation = 'lighter';
    const w = LW * ESCALA * 2, h = LH * ESCALA * 2;
    let vivos = 0;
    PONTOS.forEach(([tx], i) => {
      const nasce = i * PASSO;
      const dt = ciclo - nasce;
      if (dt < 0 || dt >= DUR) return;
      vivos++;
      const k = Math.min(N - 1, Math.floor((dt / DUR) * N));
      g.drawImage(img, k * LW, 0, LW, LH, CX + tx * T - w / 2, CHAO - h, w, h);
    });
    g.globalCompositeOperation = 'source-over';

    // Os números: cada raio castiga TODA a área aos 260 ms da queda dele.
    g.fillStyle = '#ffe36a'; g.font = 'bold 20px system-ui';
    PONTOS.forEach((_, i) => {
      const ms = i * PASSO + QUEDA;
      if (ciclo < ms || ciclo > ms + 700) return;
      g.globalAlpha = Math.max(0, 1 - (ciclo - ms) / 700);
      g.fillText('412', CX + 40 + i * 30, CHAO - 70 - (ciclo - ms) * 0.03);
    });
    g.globalAlpha = 1;

    document.getElementById('leg').textContent =
      `${Math.round(ciclo)} ms · ${vivos} raio(s) no ar · ${RAIOS} em ${JANELA} ms`
      + ` (${Math.round(PASSO)} ms entre um e outro, cada um durando ${DUR} ms)`
      + ` · tile = ${T} px na bancada`;
  }

  if (location.hash === '#tiras') {
    const COL = 5, CEL = 190, N2 = 15;
    const alvo = document.createElement('canvas');
    alvo.width = CEL * COL; alvo.height = 300 * Math.ceil(N2 / COL);
    const ag = alvo.getContext('2d');
    for (let i = 0; i < N2; i++) {
      quadro((i / N2) * (JANELA + DUR));
      ag.drawImage(c, 250, 20, 420, 520, (i % COL) * CEL, Math.floor(i / COL) * 300, CEL, 300);
    }
    c.replaceWith(alvo);
  } else {
    const t0 = performance.now();
    const laco = () => { quadro(performance.now() - t0); requestAnimationFrame(laco); };
    laco();
  }
</script>
