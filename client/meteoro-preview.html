<!doctype html>
<!--
  🌠 Bancada do Meteoro. FORA de `public/`, como as outras três: serve no
  `npm run dev` e não entra no pacote publicado.

  ☄️ **A folha VERTICAL** (13/09): o dono decidiu usar uma animação só para as
  oito direções — *"o meteoro vai cair de cima da área de conjuração"*. São 16
  quadros, onze de queda e cinco de estouro, todos ancorados pelo RODAPÉ do
  desenho (a pedra no voo, o chão no impacto).

  ⚠️ A mistura aqui é NORMAL, como no cliente desde 13/09: aditiva apagava a
  pedra e a fumaça, e a bancada mentiria a favor.

  A bancada confere as duas coisas que decidem se funciona:
    1. a pedra e a cratera caem NO MESMO ponto — a linha do chão;
    2. a pedra chega lá no fim do mergulho, que é quando o dano do servidor cai.

  ⚠️ Os números aqui são CÓPIAS da ficha e do cliente, e a bancada não sabe
  quando eles mudam. Ao mexer num dos dois lados, mexa aqui também.

  Endereços:
    (nenhum)  a queda animada, com a linha do chão
    #tiras    os 16 quadros lado a lado, no tamanho em que o jogo desenha
-->
<meta charset="utf-8">
<title>Meteoro — bancada</title>
<style>
  body { margin: 0; background: #3f5a34; color: #dfe; font: 13px system-ui, sans-serif; }
  canvas { display: block; image-rendering: pixelated; }
  p { padding: 6px 10px; margin: 0; opacity: .85; }
</style>
<canvas id="c" width="960" height="620"></canvas>
<p id="leg"></p>
<script type="module">
  const c = document.getElementById('c');
  const g = c.getContext('2d');
  const TS = 32;

  // Da ficha: `quedaMs` (o mergulho, e quando o dano chega) e a área 7×7.
  const MERGULHO = 1100, RAIO = 3;
  // Do cliente: `trajetoria`, `fracaoQueda`, `duracaoEstouro` e `ancoraY`.
  const QUEDA = 430, CRESCE = [0.42, 1], FRACAO = 11 / 15;
  const ESTOURO = 560, ANCORA_Y = 0.88;
  const ESCALA_QUEDA = 0.625, ESCALA_IMPACTO = 3.4;
  const ESCALA = ESCALA_QUEDA * ESCALA_IMPACTO;
  const CICLO = MERGULHO + ESTOURO + 600;

  const CX = 480, CHAO = 430;

  const img = await new Promise((ok) => {
    const i = new Image();
    i.onload = () => ok(i);
    i.src = '/assets/fx/meteoro_queda.png';
  });
  const LH = img.height;
  const LW = LH * (144 / 256);        // a célula do cortador: 144×256
  const N = Math.round(img.width / LW);
  const VOO = Math.round(N * FRACAO);

  function cenario() {
    g.fillStyle = '#3f5a34';
    g.fillRect(0, 0, c.width, c.height);
    g.strokeStyle = '#ffffff26';
    g.lineWidth = 2;
    g.strokeRect(CX - (RAIO + 0.5) * TS, CHAO - (RAIO + 0.5) * TS * 0.55,
      (RAIO * 2 + 1) * TS, (RAIO * 2 + 1) * TS * 0.55);
    g.fillStyle = '#00000040';
    g.fillRect(CX - 16, CHAO - 40, 32, 40);
    g.fillRect(CX + 40, CHAO - 40, 32, 40);
    // 🎯 A linha do CHÃO: é nela que a pedra e a cratera têm de cair.
    g.strokeStyle = '#ffe08a66';
    g.beginPath();
    g.moveTo(CX - 170, CHAO);
    g.lineTo(CX + 170, CHAO);
    g.stroke();
  }

  /** Desenha o quadro `k` com a âncora do cliente, no ponto (x, y). */
  function poe(k, x, y, escala) {
    const w = LW * escala;
    const h = LH * escala;
    g.drawImage(img, k * LW, 0, LW, LH, x - w / 2, y - h * ANCORA_Y, w, h);
    return [w, h];
  }

  function desenha(t) {
    cenario();
    const ciclo = t % CICLO;
    if (ciclo < MERGULHO) {
      /*
       * O MERGULHO: a pedra nasce `QUEDA` px acima do alvo e desce até ele,
       * crescendo. A fração é LINEAR aqui porque a folha só tem queda vertical —
       * a curva acelerada existia para a entrada diagonal, que saiu.
       */
      const frac = ciclo / MERGULHO;
      const k = Math.min(VOO - 1, Math.floor(frac * VOO));
      const s = ESCALA * (CRESCE[0] + (CRESCE[1] - CRESCE[0]) * frac);
      const [w, h] = poe(k, CX, CHAO - QUEDA * (1 - frac), s);
      document.getElementById('leg').textContent =
        `MERGULHO ${Math.round(ciclo)}/${MERGULHO} ms · quadro ${k + 1} de ${VOO}`
        + ` · ${Math.round(w)}×${Math.round(h)} px`
        + ` · ${((QUEDA * (1 - frac)) / TS).toFixed(1)} tiles acima do alvo`;
    } else if (ciclo < MERGULHO + ESTOURO) {
      const dt = ciclo - MERGULHO;
      const k = VOO + Math.min(N - VOO - 1, Math.floor((dt / ESTOURO) * (N - VOO)));
      const [w] = poe(k, CX, CHAO, ESCALA);
      document.getElementById('leg').textContent =
        `ESTOURO ${Math.round(dt)}/${ESTOURO} ms · quadro ${k + 1} de ${N}`
        + ` · ${Math.round(w)} px de largura (${(w / TS).toFixed(1)} tiles)`
        + ` contra ${(RAIO * 2 + 1)} de dano`;
    } else {
      document.getElementById('leg').textContent = 'fim do ciclo';
    }
  }

  if (location.hash === '#tiras') {
    const COL = 8;
    const w = LW * ESCALA, h = LH * ESCALA;
    const alvo = document.createElement('canvas');
    alvo.width = COL * w;
    alvo.height = Math.ceil(N / COL) * h;
    const ag = alvo.getContext('2d');
    ag.fillStyle = '#3f5a34';
    ag.fillRect(0, 0, alvo.width, alvo.height);
    for (let k = 0; k < N; k++) {
      ag.drawImage(img, k * LW, 0, LW, LH, (k % COL) * w, Math.floor(k / COL) * h, w, h);
    }
    c.replaceWith(alvo);
  } else {
    const t0 = performance.now();
    const laco = () => { desenha(performance.now() - t0); requestAnimationFrame(laco); };
    laco();
  }
</script>
