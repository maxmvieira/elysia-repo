<!doctype html>
<!--
  🌠 Bancada do Meteoro. FORA de `public/`, como as outras três: serve no
  `npm run dev` e não entra no pacote publicado.

  Existe para conferir a coisa que não dá para ver numa folha de contato: a
  TRAJETÓRIA. O pedido do dono (12/09) é que se leia *"um meteoro veio de longe
  e atingiu esse inimigo em cheio"*, e o contrário dele — *"uma pedra apareceu
  em cima do inimigo"* — só se distingue em movimento.

  ⚠️ Os números aqui são CÓPIAS da ficha e do cliente, e a bancada não sabe
  quando eles mudam. Ao mexer num dos dois lados, mexa aqui também.

  `#tiras` desenha o voo quadro a quadro, para conferir o giro e o crescimento.
-->
<meta charset="utf-8">
<title>Meteoro — bancada</title>
<style>
  body { margin: 0; background: #3f5a34; color: #dfe; font: 13px system-ui, sans-serif; }
  canvas { display: block; image-rendering: pixelated; }
  p { padding: 6px 10px; margin: 0; opacity: .85; }
</style>
<canvas id="c" width="960" height="620"></canvas>
<p id="leg"></p>
<script type="module">
  const c = document.getElementById('c');
  const g = c.getContext('2d');
  const img = await new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.src = '/assets/fx/meteoro40.png'; });
  const N = 40, LW = img.width / N, LH = img.height;
  const VOO = 16;                 // fracaoQueda 16/40: os quadros de voo
  const TS = 32;

  // Da ficha: quedaMs 1100 (o mergulho) e área 7×7.
  const MERGULHO = 1100, RAIO = 3;
  // Do cliente: trajetoria e ESCALA_IMPACTO.
  const DE_X = -480, DE_Y = 480, CRESCE = [0.3, 1.5];
  const ESCALA_QUEDA = 0.625, ESCALA_IMPACTO = 2.1;
  const ESTOURO = 900;
  const CICLO = MERGULHO + ESTOURO + 700;

  const CX = 660, CHAO = 470;

  function quadro(t) {
    g.fillStyle = '#3f5a34'; g.fillRect(0, 0, c.width, c.height);
    const ciclo = t % CICLO;

    // A área de dano e dois "monstros" dentro dela.
    g.strokeStyle = '#ffffff26'; g.lineWidth = 2;
    g.strokeRect(CX - (RAIO + 0.5) * TS, CHAO - (RAIO + 0.5) * TS * 0.55,
      (RAIO * 2 + 1) * TS, (RAIO * 2 + 1) * TS * 0.55);
    g.fillStyle = '#00000040';
    g.fillRect(CX - 16, CHAO - 40, 32, 40);
    g.fillRect(CX + 40, CHAO - 40, 32, 40);
    // O conjurador, para o empurrão ter direção legível.
    g.fillStyle = '#00000055';
    g.fillRect(CX - 340, CHAO - 44, 26, 44);

    g.globalCompositeOperation = 'lighter';
    if (ciclo < MERGULHO) {
      /*
       * O MERGULHO. Fração acelerada: o meteoro ganha velocidade ao se
       * aproximar. Expoente 1,6 e não 2: ao quadrado ele passava meio mergulho
       * fora da tela. Ver `trajetoria` no cliente.
       */
      const frac = ciclo / MERGULHO;
      const p = frac ** 1.6;
      const k = Math.min(VOO - 1, Math.floor(frac * VOO));
      const s = CRESCE[0] + (CRESCE[1] - CRESCE[0]) * p;
      const w = LW * s, h = LH * s;
      const x = CX + DE_X * (1 - p);
      const y = CHAO - DE_Y * (1 - p);
      g.save();
      g.translate(x, y);
      // A arte aponta para baixo-direita (45°); o giro é a diferença do rumo.
      g.rotate(Math.atan2(DE_Y, -DE_X) - Math.PI / 4);
      g.drawImage(img, k * LW, 0, LW, LH, -w / 2, -h / 2, w, h);
      g.restore();
      document.getElementById('leg').textContent =
        `MERGULHO ${Math.round(ciclo)}/${MERGULHO} ms · quadro ${k + 1} de ${VOO}`
        + ` · escala ${s.toFixed(2)} · ${Math.round(Math.hypot(x - CX, y - CHAO) / TS)} tiles do alvo`;
    } else if (ciclo < MERGULHO + ESTOURO) {
      const dt = ciclo - MERGULHO;
      const k = VOO + Math.min(N - VOO - 1, Math.floor((dt / ESTOURO) * (N - VOO)));
      const s = ESCALA_QUEDA * ESCALA_IMPACTO;
      const w = LW * s, h = LH * s;
      g.drawImage(img, k * LW, 0, LW, LH, CX - w / 2, CHAO - h, w, h);
      document.getElementById('leg').textContent =
        `ESTOURO ${Math.round(dt)}/${ESTOURO} ms · quadro ${k + 1} de ${N}`
        + ` · ${Math.round(w)} px de largura (${(w / TS).toFixed(1)} tiles) contra ${(RAIO * 2 + 1)} de dano`;
    } else {
      document.getElementById('leg').textContent = 'fim do ciclo';
    }
    g.globalCompositeOperation = 'source-over';
  }

  if (location.hash === '#tiras') {
    const COL = 6, CEL = 150, N2 = 12;
    const alvo = document.createElement('canvas');
    alvo.width = CEL * COL; alvo.height = 150 * Math.ceil(N2 / COL);
    const ag = alvo.getContext('2d');
    for (let i = 0; i < N2; i++) {
      quadro((i / N2) * (MERGULHO + ESTOURO));
      ag.drawImage(c, 0, 0, 960, 620, (i % COL) * CEL, Math.floor(i / COL) * 150, CEL, 150 * 620 / 960);
    }
    c.replaceWith(alvo);
  } else {
    const t0 = performance.now();
    const laco = () => { quadro(performance.now() - t0); requestAnimationFrame(laco); };
    laco();
  }
</script>
